name: "retail_medallion"
version: "1.0.0"
config-version: 2
profile: "retail_medallion"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layer materializations: bronze/silver stay as views so they are always
# fresh; gold marts are tables for fast, stable analytics queries.
models:
  retail_medallion:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
